name: Build OSCam Linux arm64

on:
  workflow_dispatch:
    inputs:
      ipv6:
        description: '启用 IPv6 支持（IPV6SUPPORT）'
        required: false
        default: true
        type: boolean
      pcsc:
        description: '启用 PCSC 读卡器（交叉编译静态 libpcsclite；运行时盒子需安装 pcscd 并插 USB 读卡器）'
        required: false
        default: false
        type: boolean
      extra_enable:
        description: '额外 config.sh --enable 选项（空格分隔，可留空）'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build-linux-arm64:
    name: Build Linux arm64 (aarch64)
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前仓库源码
        uses: actions/checkout@v5

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            dialog patch wget

          aarch64-linux-gnu-gcc --version

      - name: 创建 CMake 交叉编译工具链文件
        run: |
          cat > /tmp/toolchain-arm64.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)

          set(CMAKE_C_COMPILER /usr/bin/aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER /usr/bin/aarch64-linux-gnu-g++)

          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)

          # 目标：Hi3798C V200（Cortex-A53，ARMv8-A）等 aarch64 设备。
          # aarch64 gcc 默认 -march=armv8-a，无需额外架构参数；静态链接保证
          # 在无多架构（multiarch）库的 Debian aarch64 盒子上开箱即用。
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static")
          EOF
          cat /tmp/toolchain-arm64.cmake

      - name: 交叉编译 ARM64 版 libusb
        run: |
          cd /tmp
          wget -q https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2
          tar -xf libusb-1.0.29.tar.bz2
          cd libusb-1.0.29
          ./configure \
            --host=aarch64-linux-gnu \
            --prefix=/tmp/arm64-libs \
            --disable-udev \
            --enable-static \
            --disable-shared
          make -j$(nproc)
          make install
          ls -la /tmp/arm64-libs/lib/

      - name: 交叉编译 ARM64 版 pcsc-lite（静态 libpcsclite）
        # pcsc-lite 2.5.2 起只有 meson 构建（autotools 已移除）。
        # 关掉 daemon 依赖组件（udev/systemd/polkit/usb/serial），只产静态客户端库；
        # 运行时由目标盒子上的 pcscd（apt 安装）提供守护进程，oscam 仅经 socket 与其通信。
        if: ${{ inputs.pcsc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

          cd /tmp
          wget -q https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.2.tar.gz -O pcsc-2.5.2.tar.gz
          tar -xf pcsc-2.5.2.tar.gz

          cat > /tmp/aarch64-pcsc-cross.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          meson setup /tmp/pcsc-build PCSC-2.5.2 \
            --cross-file /tmp/aarch64-pcsc-cross.txt \
            --default-library static \
            --prefix /tmp/arm64-pcsc \
            -Dlibudev=false -Dlibsystemd=false -Dpolkit=false \
            -Dusb=false -Dserial=false
          ninja -C /tmp/pcsc-build

          # 手工落位成 CMake -DPCSCDIR 期望的布局：<dir>/include/PCSC + <dir>/lib/libpcsclite.a
          mkdir -p /tmp/arm64-pcsc/include/PCSC /tmp/arm64-pcsc/lib
          cp PCSC-2.5.2/src/PCSC/*.h /tmp/arm64-pcsc/include/PCSC/
          # 上游 CMakeLists 只传 -I${PCSCDIR}/include/PCSC，而 ifd_pcsc.c 写的是
          # #include <PCSC/pcsclite.h>（-I 目录下需再有一层 PCSC/）。
          # x64 靠系统默认 /usr/include 兜底，交叉静态环境无此路径，补嵌套层解决。
          mkdir -p /tmp/arm64-pcsc/include/PCSC/PCSC
          cp PCSC-2.5.2/src/PCSC/*.h /tmp/arm64-pcsc/include/PCSC/PCSC/
          find /tmp/pcsc-build -name "libpcsclite.a" -exec cp {} /tmp/arm64-pcsc/lib/ \;
          ls -la /tmp/arm64-pcsc/lib/ /tmp/arm64-pcsc/include/PCSC/

      - name: 配置构建选项
        env:
          IPV6_OPT: ${{ inputs.ipv6 }}
          PCSC_OPT: ${{ inputs.pcsc }}
          EXTRA_ENABLE: ${{ inputs.extra_enable }}
        run: |
          chmod +x config.sh
          ./config.sh --restore
          ./config.sh --enable WEBIF WITH_SSL
          ./config.sh --enable MODULE_NEWCAMD MODULE_CCCAM MODULE_CAMD35
          ./config.sh --enable READER_BULCRYPT READER_NAGRA READER_CONAX
          ./config.sh --enable WITH_LIBUSB
          # 启用新增的国产 CA 系统（同方 TongFang / 数码视讯 StreamGuard）
          ./config.sh --enable READER_TONGFANG READER_STREAMGUARD READER_JET

          # 可选开关：IPv6（变量为空 = push 触发，取默认值）
          : "${IPV6_OPT:=true}"
          if [ "$IPV6_OPT" = "true" ]; then
            ./config.sh --enable IPV6SUPPORT
          fi
          # 可选开关：PCSC（静态 libpcsclite 由上方 pcsc-lite 步骤交叉编译）
          : "${PCSC_OPT:=false}"
          if [ "$PCSC_OPT" = "true" ]; then
            ./config.sh --enable WITH_PCSC
          fi
          # 额外自定义选项
          if [ -n "$EXTRA_ENABLE" ]; then
            # shellcheck disable=SC2086
            ./config.sh --enable $EXTRA_ENABLE
          fi

      - name: 预生成 WebIF 页面模板
        # 同其他平台：显式预生成 webif/pages.h 并校验，避免 CMake 配置期静默失败。
        run: |
          chmod +x webif/pages_mkdep
          make -C webif
          if [ ! -f webif/pages.h ]; then
            echo "::error::webif/pages.h 未生成，Web 管理界面（module-webif-tpl.c）将无法编译"
            exit 1
          fi
          ls -la webif/pages.h webif/pages.c

      - name: 构建期动态补丁（保留 toolchain 注入的 -static）
        # 不改源码：上游 CMakeLists.txt 在按构建类型分支里整体硬覆盖 CMAKE_EXE_LINKER_FLAGS，
        # 会冲掉 toolchain 文件里 CMAKE_EXE_LINKER_FLAGS_INIT 注入的 "-static"，
        # 导致产物动态链接、要求 runner 的 glibc（GLIBC_2.38）而无法在老设备运行。
        # 构建前用 sed 把硬覆盖改为追加式，仅在 CI 工作区内生效。
        run: |
          sed -i \
            -e 's|set (CMAKE_EXE_LINKER_FLAGS "-s")|set (CMAKE_EXE_LINKER_FLAGS "${CMAKE_EXE_LINKER_FLAGS} -s")|' \
            -e 's|set (CMAKE_EXE_LINKER_FLAGS "-ggdb")|set (CMAKE_EXE_LINKER_FLAGS "${CMAKE_EXE_LINKER_FLAGS} -ggdb")|' \
            CMakeLists.txt
          echo "=== 补丁后的链接器 flag 行 ==="
          grep -n 'CMAKE_EXE_LINKER_FLAGS' CMakeLists.txt | grep -v isysroot

      - name: 交叉编译 OSCam
        env:
          PCSC_OPT: ${{ inputs.pcsc }}
        run: |
          mkdir -p build && cd build

          PCSC_ARGS=""
          if [ "$PCSC_OPT" = "true" ]; then
            PCSC_ARGS="-DHAVE_PCSC=1 -DSTATIC_PCSC=1 -DPCSCDIR=/tmp/arm64-pcsc"
          fi

          cmake \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/toolchain-arm64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBUSB=1 \
            -DLIBUSB_LIB=/tmp/arm64-libs/lib/libusb-1.0.a \
            -DLIBUSB_INCLUDE_DIR=/tmp/arm64-libs/include/libusb-1.0 \
            $PCSC_ARGS \
            ..

          make -j$(nproc)

      - name: 验证交叉编译产物
        run: |
          ls -la build/oscam
          file build/oscam
          echo "=== 检查 ELF 架构 ==="
          aarch64-linux-gnu-readelf -h build/oscam | grep -E "Class|Machine|Flags"
          echo "=== 动态依赖（无 NEEDED = 全静态，可在任意 glibc 版本运行） ==="
          aarch64-linux-gnu-readelf -d build/oscam | grep NEEDED || echo "(no NEEDED entries — fully static)"

      - name: 上传构建产物
        # 构建产物始终上传（便于测试性构建也能下载二进制）。
        uses: actions/upload-artifact@v6
        with:
          name: oscam-linux-arm64
          path: build/oscam
          retention-days: 30
