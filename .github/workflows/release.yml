name: Release OSCam

# 由 arm64 构建工作流完成后触发。tag 只取运行当天日期（build-YYYYMMDD），
# 同一天的多次构建发布共用同一个 tag：后发布的一方会把产物覆盖到当天
# 已创建的 Release 上（提交 sha 仅记录在 Release 说明里）。
on:
  workflow_run:
    workflows:
      - Build OSCam Linux arm64
    types:
      - completed

permissions:
  contents: write
  actions: read

# 同一提交的发布串行执行，避免竞争创建同名 tag。
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release-linux-arm64:
    name: 发布 Linux arm64
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.name == 'Build OSCam Linux arm64'

    steps:
      # checkout 必须排在下载产物之前：它默认 clean: true（git clean -ffdx），
      # 会把工作区里未跟踪的 artifacts/ 一起清掉。deb 打包需要源码里的
      # packaging/，所以这一步不能省，只能提前。
      - name: 检出源码（取 deb 打包文件）
        # 打包用的 control/配置文件必须来自同一次构建的提交，而不是默认分支。
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 获取版本信息
        # 版本 = 运行当天日期（UTC）。同一天内多次构建发布共用同一个
        # tag，产物互相覆盖更新；提交 sha 仅记录在 Release 说明中。
        # deb 包版本取同一个值，保证包名与 Release tag 对得上。
        id: version
        run: |
          echo "version=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 下载构建产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            -n oscam-linux-arm64 -D artifacts/oscam-linux-arm64
          echo "=== 下载内容 ==="
          find artifacts -type f -printf '%p  %s bytes\n'

      - name: 准备发布文件
        run: |
          set -euo pipefail
          mkdir -p release/
          cp artifacts/oscam-linux-arm64/oscam release/oscam-linux-arm64
          # upload-artifact 不保留文件权限，解出来的产物是 0644，这里补回可执行位
          chmod 0755 release/oscam-linux-arm64
          ( cd release && sha256sum oscam-linux-arm64 > oscam-linux-arm64.sha256 )
          ls -la release/

      - name: 打包 deb
        run: |
          bash packaging/deb/build-deb.sh \
            --arch arm64 \
            --binary artifacts/oscam-linux-arm64/oscam \
            --output release \
            --version "${{ steps.version.outputs.version }}"

      - name: 校验 deb
        # 权限断言必须放在这里：Windows 本地无法验证 chmod/install 的
        # 实际效果，只有 Linux 上的 dpkg-deb -c 才是可信的。
        run: |
          set -euo pipefail
          DEB="release/oscam_${{ steps.version.outputs.version }}_arm64.deb"
          test -f "$DEB"
          echo "=== $DEB ==="
          dpkg-deb --info "$DEB"
          echo "=== 内容 ==="
          dpkg-deb -c "$DEB"

          dpkg-deb -c "$DEB" | grep -q -- '-rwxr-xr-x root/root .*/usr/local/bin/oscam$' \
            || { echo "::error::/usr/local/bin/oscam 权限不是 0755"; exit 1; }
          for f in oscam.conf oscam.server oscam.user oscam.dvbapi; do
            dpkg-deb -c "$DEB" | grep -q -- "-rw------- root/root .*/usr/local/etc/$f\$" \
              || { echo "::error::/usr/local/etc/$f 权限不是 0600"; exit 1; }
          done
          dpkg-deb -c "$DEB" | grep -q -- '-rw-r--r-- root/root .*/lib/systemd/system/oscam.service$' \
            || { echo "::error::oscam.service 权限不是 0644"; exit 1; }

          # DEBIAN/ 在 control.tar 里，dpkg-deb -c 只列数据包、看不到它，
          # 所以解出控制区再查。
          CTRL=$(mktemp -d)
          dpkg-deb -e "$DEB" "$CTRL"
          for s in postinst prerm postrm; do
            test "$(stat -c '%a' "$CTRL/$s")" = 755 \
              || { echo "::error::DEBIAN/$s 权限不是 0755"; exit 1; }
          done
          for f in oscam.conf oscam.server oscam.user oscam.dvbapi; do
            grep -qx "/usr/local/etc/$f" "$CTRL/conffiles" \
              || { echo "::error::conffiles 缺少 /usr/local/etc/$f"; exit 1; }
          done

          test "$(dpkg-deb -f "$DEB" Architecture)" = arm64
          # 全静态产物不应出现 Depends。字段不存在时 dpkg-deb -f 会报错退出，
          # 所以用管道 + grep 判"有没有内容"，而不是 test -z "$(dpkg-deb -f ...)"。
          if dpkg-deb -f "$DEB" Depends 2>/dev/null | grep -q .; then
            echo "::error::静态产物不应带 Depends"
            exit 1
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ steps.version.outputs.version }}
          name: OSCam Build ${{ steps.version.outputs.version }}
          body: |
            ## OSCam 自动构建

            **提交**: `${{ github.event.workflow_run.head_sha }}`

            ### 产物说明
            | 文件 | 平台 | 架构 |
            |------|------|------|
            | `oscam-linux-arm64` | Linux arm64（全静态） | aarch64 (ARMv8) |
            | `oscam_<ver>_arm64.deb` | Debian/Ubuntu | arm64 |

            只发布 arm64 一个平台；二进制附带同名 `.sha256` 校验文件。

            ### deb 包内容
            - `/usr/local/bin/oscam`
            - `/usr/local/etc/oscam.{conf,server,user,dvbapi}`（标记为 conffile，升级保留改动）
            - `/lib/systemd/system/oscam.service`

            二进制全静态链接，deb 无运行时库依赖（`Depends` 为空）。

            安装：`sudo dpkg -i oscam_<ver>_arm64.deb`（会 `daemon-reload`、`enable` 并启动服务）。
          files: |
            release/oscam-linux-arm64
            release/oscam-linux-arm64.sha256
            release/oscam_${{ steps.version.outputs.version }}_arm64.deb
