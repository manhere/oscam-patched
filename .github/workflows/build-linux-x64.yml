name: Build OSCam Linux x64

on:
  workflow_dispatch:
    inputs:
      ipv6:
        description: '启用 IPv6 支持（IPV6SUPPORT）'
        required: false
        default: true
        type: boolean
      pcsc:
        description: '启用 PCSC 读卡器（WITH_PCSC）'
        required: false
        default: true
        type: boolean
      extra_enable:
        description: '额外 config.sh --enable 选项（空格分隔，可留空）'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前仓库源码
        uses: actions/checkout@v5

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libssl-dev \
            libusb-1.0-0-dev \
            libpcsclite-dev pcscd \
            dialog patch

      - name: 配置构建选项
        env:
          IPV6_OPT: ${{ inputs.ipv6 }}
          PCSC_OPT: ${{ inputs.pcsc }}
          EXTRA_ENABLE: ${{ inputs.extra_enable }}
        run: |
          chmod +x config.sh
          ./config.sh --restore

          # 启用常用功能模块
          ./config.sh --enable WEBIF WITH_SSL
          ./config.sh --enable MODULE_NEWCAMD MODULE_CCCAM MODULE_CAMD35
          ./config.sh --enable READER_BULCRYPT READER_NAGRA READER_CONAX
          ./config.sh --enable WITH_LIBUSB
          # 启用新增的国产 CA 系统（同方 TongFang / 数码视讯 StreamGuard）
          ./config.sh --enable READER_TONGFANG READER_STREAMGUARD READER_JET

          # 可选开关：IPv6（变量为空 = push 触发，取默认值）
          : "${IPV6_OPT:=true}"
          if [ "$IPV6_OPT" = "true" ]; then
            ./config.sh --enable IPV6SUPPORT
          fi
          # 可选开关：PCSC
          : "${PCSC_OPT:=true}"
          if [ "$PCSC_OPT" = "true" ]; then
            ./config.sh --enable WITH_PCSC
          fi
          # 额外自定义选项
          if [ -n "$EXTRA_ENABLE" ]; then
            # shellcheck disable=SC2086
            ./config.sh --enable $EXTRA_ENABLE
          fi

          echo "=== 当前配置 ==="
          cat config.h 2>/dev/null | head -50 || echo "config.h 未生成，将使用默认配置"

      - name: 预生成 WebIF 页面模板
        # webif/pages.h / pages.c 由 webif/pages_gen 在构建期生成，module-webif-tpl.c 编译时
        # 依赖 webif/pages.h。CMake 配置期也会尝试 make -C webif，但旧逻辑静默忽略失败，
        # 导致后续编译才暴露“No such file or directory”。此处显式预生成并校验，失败即中断，
        # 便于第一时间定位，同时保证 cmake 配置期 glob 时文件已存在。
        run: |
          chmod +x webif/pages_mkdep
          make -C webif
          if [ ! -f webif/pages.h ]; then
            echo "::error::webif/pages.h 未生成，Web 管理界面（module-webif-tpl.c）将无法编译"
            exit 1
          fi
          ls -la webif/pages.h webif/pages.c

      - name: 编译 OSCam
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: 验证产物
        run: |
          ls -la build/oscam
          file build/oscam
          ./build/oscam --help 2>&1 | head -5 || true

      - name: 上传构建产物
        # 构建产物始终上传（便于测试性构建也能下载二进制）。
        uses: actions/upload-artifact@v6
        with:
          name: oscam-linux-x64
          path: build/oscam
          retention-days: 30
